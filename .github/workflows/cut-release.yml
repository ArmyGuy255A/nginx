name: cut-release

# Auto-tag and publish a GitHub Release on every push to main.
#
# Tag scheme:  v<NGINX_VERSION>.<BUILDVER>
#   * <NGINX_VERSION>  read from nginx_version.txt (e.g. 1.26.2)
#   * <BUILDVER>       read from buildver.txt; incremented and committed
#                      back to main as a [skip ci] commit on each release
#
# When .github/workflows/check-nginx-version.yml lands a PR that bumps
# nginx_version.txt to a new value AND resets buildver.txt to 0, the next
# release tag becomes v<NEW>.0. Subsequent commits on the same nginx
# version progress as v<NEW>.1, v<NEW>.2, ...
#
# Docker Hub Automated Build Rules (configured per DOCKERHUB_SETUP.md) are
# triggered by these tag pushes and produce:
#   armyguy255a/nginx:alpine-<NGINX>.<BUILD>   (Dockerfile.alpine)
#   armyguy255a/nginx:appeid-<NGINX>.<BUILD>   (Dockerfile.appeid)
# plus the family-scoped :latest / :appeid-latest tags via hooks/post_push.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you manually cutting a release? (logged in the GitHub Release body)'
        required: false
        default: 'manual rebuild'

# A single concurrent release at a time, with cancellation disabled — we
# never want a release-in-flight to be torn down mid-tag-push.
concurrency:
  group: cut-release
  cancel-in-progress: false

permissions:
  contents: write   # tag + release + commit buildver bump back to main

jobs:
  release:
    name: Tag + release
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')

    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version + bump buildver
        id: ver
        run: |
          set -euo pipefail
          NGINX_VERSION="$(cat nginx_version.txt | tr -d '[:space:]')"
          CURRENT_BUILD="$(cat buildver.txt | tr -d '[:space:]')"
          NEXT_BUILD="$((CURRENT_BUILD + 1))"
          TAG="v${NGINX_VERSION}.${NEXT_BUILD}"
          echo "nginx_version=${NGINX_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${NEXT_BUILD}"           >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"                    >> "$GITHUB_OUTPUT"
          echo "Cutting ${TAG}"

      - name: Configure git author
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit buildver bump
        run: |
          set -euo pipefail
          echo "${{ steps.ver.outputs.build }}" > buildver.txt
          git add buildver.txt
          git commit -m "chore(release): ${{ steps.ver.outputs.tag }} [skip ci]"
          git push origin HEAD:main

      - name: Create annotated tag
        run: |
          set -euo pipefail
          git tag -a "${{ steps.ver.outputs.tag }}" \
            -m "nginx ${{ steps.ver.outputs.nginx_version }} build ${{ steps.ver.outputs.build }}"
          git push origin "refs/tags/${{ steps.ver.outputs.tag }}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          NGINX_VERSION="${{ steps.ver.outputs.nginx_version }}"
          BUILD="${{ steps.ver.outputs.build }}"

          # Use release-drafter-style auto notes generated by GitHub.
          gh release create "${TAG}" \
            --target main \
            --title "nginx ${NGINX_VERSION} build ${BUILD}" \
            --generate-notes

          echo "✅ Released ${TAG}"
          echo "Docker Hub will now build:"
          echo "  armyguy255a/nginx:alpine-${NGINX_VERSION}.${BUILD}"
          echo "  armyguy255a/nginx:appeid-${NGINX_VERSION}.${BUILD}"
