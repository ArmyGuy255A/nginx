name: validate

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workflows:
    name: GitHub Actions lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          docker run --rm --entrypoint shellcheck -v "$PWD:/repo:ro" \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            /repo/.github/scripts/check-upstream.sh /repo/.github/scripts/smoke-image.sh

  dependency-logic:
    name: Dependency and vulnerability policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 .github/scripts/versions.py --check

  versions-json:
    name: versions.json schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          set -euo pipefail
          jq -e '.nginx and .alpine'                                  versions.json >/dev/null
          jq -e '.nginx  | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")'        versions.json >/dev/null
          # alpine may be 3.23.1 (with patch) OR bare 3.23 when a new
          # minor is published before any patch tags. Both are valid.
          jq -e '.alpine | test("^[0-9]+\\.[0-9]+(\\.[0-9]+)?$")'     versions.json >/dev/null
          echo "✓ versions.json well-formed"

  dockerfile-matches:
    name: Dockerfile.alpine matches versions.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          set -euo pipefail
          PINNED=$(jq -r .nginx versions.json)
          DOCKER=$(grep -oE '^ENV NGINX_VERSION=[0-9.]+' Dockerfile.alpine | cut -d= -f2)
          [ "$PINNED" = "$DOCKER" ] || { echo "NGINX_VERSION drift: versions.json=$PINNED, Dockerfile=$DOCKER" >&2; exit 1; }

          PINNED=$(jq -r .alpine versions.json)
          DOCKER=$(grep -oE '^FROM alpine:[0-9.]+' Dockerfile.alpine | cut -d: -f2)
          [ "$PINNED" = "$DOCKER" ] || { echo "FROM alpine drift: versions.json=$PINNED, Dockerfile=$DOCKER" >&2; exit 1; }

          # MODULE_URL_BASE always uses major.minor regardless of whether
          # the FROM tag has a patch suffix. awk -F. always yields $1.$2
          # which works for both "3.23.1" and bare "3.23".
          PINNED_MM=$(echo "$PINNED" | awk -F. '{print $1"."$2}')
          DOCKER_MM=$(grep -oE 'alpine/v[0-9.]+/main/' Dockerfile.alpine | sed -E 's|alpine/v([0-9.]+)/main/|\1|')
          [ "$PINNED_MM" = "$DOCKER_MM" ] || { echo "MODULE_URL_BASE drift: derived=$PINNED_MM, Dockerfile=$DOCKER_MM" >&2; exit 1; }
          echo "✓ Dockerfile.alpine fully synced"
