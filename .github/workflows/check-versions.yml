name: check-versions

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-versions
  cancel-in-progress: false

jobs:
  bump:
    name: Refresh upstream dependencies
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Probe upstream versions
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/check-upstream.sh

      - name: Update manifest and Dockerfile
        id: update
        env:
          NGINX: ${{ steps.probe.outputs.nginx }}
          ALPINE: ${{ steps.probe.outputs.alpine }}
          HEADERS_MORE: ${{ steps.probe.outputs.headers_more }}
          FANCYINDEX: ${{ steps.probe.outputs.fancyindex }}
          SUBSTITUTIONS: ${{ steps.probe.outputs.substitutions }}
          OTEL: ${{ steps.probe.outputs.otel }}
        run: python3 .github/scripts/versions.py

      - name: Verify dependency changes before commit
        if: steps.update.outputs.changed == '1'
        run: |
          set -euo pipefail
          docker build --pull --no-cache -f Dockerfile.alpine -t check-versions:verify .
          bash .github/scripts/smoke-image.sh check-versions:verify

      - name: Commit verified dependency update
        if: steps.update.outputs.changed == '1'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add versions.json Dockerfile.alpine
          git commit -m 'chore(deps): refresh nginx, alpine and module versions'
          git push origin HEAD:main

      - name: Resolve exact publication commit
        id: ref
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: bump
    # Refresh package patches every day even when all version pins are unchanged.
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.bump.outputs.ref }}
    secrets: inherit
