name: check-versions

# Polls upstream for fresh releases of nginx + alpine (patch-level within
# the current major.minor). When versions.json drifts behind upstream:
#   1. Rewrites versions.json with the new values.
#   2. Edits Dockerfile.alpine inline (FROM alpine:<patch>, ENV NGINX_VERSION,
#      and the MODULE_URL_BASE Alpine path segment which uses major.minor).
#   3. Commits to main. Branch-push fires DH Build Rule 1 -> :alpine-latest.
#   4. If nginx VERSION specifically changed, also pushes tag v<new-nginx>.
#      That fires DH Build Rule 2 -> :alpine-<new>. Versioned tags are
#      immutable; security-only patches surface through :alpine-latest only.
#
# Alpine MAJOR.MINOR bumps (3.22 -> 3.23) require a human edit to
# versions.json — the workflow stays within whichever major.minor is
# currently pinned to avoid breaking on Alpine releases that haven't yet
# stocked the nginx-module-otel package.

on:
  schedule:
    - cron: '0 6 * * *'   # daily 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-versions
  cancel-in-progress: true

jobs:
  bump:
    name: Probe upstream + apply bumps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Probe upstream versions
        id: probe
        run: |
          set -euo pipefail
          HTML="$(curl -fsSL https://nginx.org/en/download.html)"
          STABLE_BLOCK="$(echo "$HTML" | sed -n '/Stable version/,/Mainline version/p')"
          NGINX_LATEST="$(echo "$STABLE_BLOCK" | \
            grep -oE 'nginx-[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz' | \
            sed -E 's/^nginx-([0-9]+\.[0-9]+\.[0-9]+)\.tar\.gz$/\1/' | \
            sort -V | tail -n 1)"

          PINNED_ALPINE="$(jq -r .alpine versions.json)"
          ALPINE_MM="${PINNED_ALPINE%.*}"
          ALPINE_LATEST="$(curl -fsSL "https://hub.docker.com/v2/repositories/library/alpine/tags?page_size=200" \
            | jq -r '.results[].name' \
            | grep -E "^${ALPINE_MM//./\\.}\\.[0-9]+$" \
            | sort -V | tail -n 1)"

          for v in NGINX ALPINE; do
            eval "val=\$${v}_LATEST"
            if [ -z "$val" ]; then
              echo "::error::Could not parse latest ${v} version" >&2
              exit 1
            fi
          done

          echo "nginx=$NGINX_LATEST"   >> "$GITHUB_OUTPUT"
          echo "alpine=$ALPINE_LATEST" >> "$GITHUB_OUTPUT"
          echo "alpine_mm=$ALPINE_MM"  >> "$GITHUB_OUTPUT"
          echo "Upstream: nginx=$NGINX_LATEST alpine=$ALPINE_LATEST (within ${ALPINE_MM}.x)"

      - name: Compare against versions.json
        id: diff
        env:
          NGINX:  ${{ steps.probe.outputs.nginx }}
          ALPINE: ${{ steps.probe.outputs.alpine }}
        run: |
          set -euo pipefail
          P_NGINX=$(jq  -r .nginx  versions.json)
          P_ALPINE=$(jq -r .alpine versions.json)
          CHANGED=0; NGINX_CHANGED=0; MSG=""
          if [ "$P_NGINX"  != "$NGINX" ]  ; then CHANGED=1; NGINX_CHANGED=1; MSG+=" nginx $P_NGINX→$NGINX"; fi
          if [ "$P_ALPINE" != "$ALPINE" ] ; then CHANGED=1; MSG+=" alpine $P_ALPINE→$ALPINE"; fi
          echo "changed=$CHANGED"             >> "$GITHUB_OUTPUT"
          echo "nginx_changed=$NGINX_CHANGED" >> "$GITHUB_OUTPUT"
          echo "msg=$MSG"                     >> "$GITHUB_OUTPUT"
          [ "$CHANGED" = "0" ] && echo "All versions current." || echo "Drift:$MSG"

      - name: Rewrite versions.json + Dockerfile.alpine
        if: steps.diff.outputs.changed == '1'
        env:
          NGINX:     ${{ steps.probe.outputs.nginx }}
          ALPINE:    ${{ steps.probe.outputs.alpine }}
          ALPINE_MM: ${{ steps.probe.outputs.alpine_mm }}
        run: |
          set -euo pipefail
          jq --arg nginx "$NGINX" --arg alpine "$ALPINE" \
             '.nginx=$nginx | .alpine=$alpine' \
             versions.json > versions.json.tmp
          mv versions.json.tmp versions.json
          sed -i \
            -e "s|^FROM alpine:.*|FROM alpine:${ALPINE}|" \
            -e "s|^ENV NGINX_VERSION=.*|ENV NGINX_VERSION=${NGINX}|" \
            -e "s|/alpine/v[0-9.]\+/main/|/alpine/v${ALPINE_MM}/main/|g" \
            Dockerfile.alpine

      - name: Commit + push + maybe tag
        if: steps.diff.outputs.changed == '1'
        env:
          NGINX:         ${{ steps.probe.outputs.nginx }}
          NGINX_CHANGED: ${{ steps.diff.outputs.nginx_changed }}
          MSG:           ${{ steps.diff.outputs.msg }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json Dockerfile.alpine
          if git diff --cached --quiet; then
            echo "Nothing to commit despite drift (race?)."
            exit 0
          fi
          git commit -m "chore(deps):${MSG}"
          git push origin HEAD:main
          if [ "$NGINX_CHANGED" = "1" ]; then
            TAG="v${NGINX}"
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists — skipping."
            else
              git tag -a "$TAG" -m "nginx $NGINX (auto-cut by check-versions)"
              git push origin "refs/tags/$TAG"
              echo "Pushed $TAG — DH builds :alpine-$NGINX"
            fi
          fi