name: build-push

# Replaces Docker Hub Automated Builds (deprecated by Docker; full retire
# 2027-04-01). See https://docs.docker.com/docker-hub/repos/manage/builds/migrate/
# Pattern mirrors Docker's reference workflow at
# https://github.com/docker/autobuilds-actions
#
# Triggers:
#   * pull_request to main     → build (load locally), DON'T push.
#                                Catches Dockerfile regressions in PRs.
#   * push to `main`           → build + publish armyguy255a/nginx:alpine-latest
#   * push tag matching v*     → build + publish armyguy255a/nginx:alpine-<ver>
#   * workflow_dispatch        → manual one-shot
#
# Required secrets (one-time GH repo setup):
#   DOCKERHUB_USERNAME   armyguy255a
#   DOCKERHUB_TOKEN      Personal Access Token (Read & Write) from
#                        hub.docker.com → Account Settings → Personal
#                        Access Tokens. Store in repo Settings → Secrets
#                        and variables → Actions.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: armyguy255a/nginx

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (push on main + tags)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive image tags + labels from ref
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=alpine-latest,enable={{is_default_branch}}
            type=match,pattern=v(.+),group=1,prefix=alpine-
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # Log in to Docker Hub only when we're actually going to push (push
      # to main or tag). PR runs skip login so a forked-PR contributor
      # can't trigger pushes from a malicious build context.
      - name: Log in to Docker Hub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Always build. Pushes only on push events (main or tags) — PRs
      # exercise the Dockerfile end-to-end as a regression check without
      # leaking pre-merge images to Docker Hub. Provenance + SBOM are
      # attached on every pushed image (Docker Scout policy: Supply
      # chain attestations) — these are SLSA build provenance and a
      # software bill of materials in SPDX format, attached to the
      # image as OCI referrers.
      - name: Build (and push on main/tag)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.alpine
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: always()
        run: |
          {
            echo "## Build summary"
            echo "- **Ref:** \`${{ github.ref }}\`"
            echo "- **Event:** \`${{ github.event_name }}\`"
            echo "- **Tags:**"
            echo '  ```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '  ```'
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "- **Push:** skipped (PR build — verification only)"
            else
              echo "- **Push:** ✅ to Docker Hub"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

