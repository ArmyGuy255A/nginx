name: build-push

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: nginx-publish-${{ github.event_name == 'pull_request' && github.ref || 'dockerhub' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      ref: ${{ steps.version.outputs.ref }}
    env:
      IMAGE: armyguy255a/nginx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Validate version and publication target
        id: version
        env:
          REQUESTED_REF: ${{ inputs.ref || github.ref }}
        run: |
          set -euo pipefail
          python3 .github/scripts/versions.py --check
          VERSION="$(jq -er '.nginx | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' versions.json)"
          grep -qx "ENV NGINX_VERSION=$VERSION" Dockerfile.alpine
          if [[ "$REQUESTED_REF" == refs/tags/* ]] && [ "$REQUESTED_REF" != "refs/tags/v$VERSION" ]; then
            echo 'Release tag does not match nginx version' >&2; exit 1
          fi
          PUBLISH=false
          ROLLING=false
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            if [[ "$REQUESTED_REF" == refs/tags/v* ]]; then
              PUBLISH=true
            elif [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
              PUBLISH=true
              ROLLING=true
            else
              echo 'Only current main or a matching release tag can publish' >&2; exit 1
            fi
          fi
          {
            echo "version=$VERSION"
            echo "publish=$PUBLISH"
            echo "rolling=$ROLLING"
            echo "ref=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for verification
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.alpine
          load: true
          pull: true
          no-cache: true
          tags: nginx-ci:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: bash .github/scripts/smoke-image.sh nginx-ci:verify

      - name: Scan all detected image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: latest
          image-ref: nginx-ci:verify
          scanners: vuln
          format: json
          output: trivy-report.json
          exit-code: '0'
          ignore-unfixed: false

      - name: Retain complete vulnerability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vulnerability-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: trivy-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Block fixable high and critical vulnerabilities
        run: |
          set -euo pipefail
          python3 .github/scripts/check_vulnerabilities.py trivy-report.json

      - name: Log in to Docker Hub
        if: steps.version.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare publication tags
        id: tags
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ROLLING: ${{ steps.version.outputs.rolling }}
        run: |
          set -euo pipefail
          if [ "$ROLLING" = true ]; then
            git fetch origin main
            [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || {
              echo 'main advanced during build; refusing to publish stale rolling tags' >&2; exit 1;
            }
          fi
          {
            echo 'tags<<EOF'
            echo "$IMAGE:alpine-$VERSION"
            echo "$IMAGE:sha-$(git rev-parse HEAD)"
            echo "$IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            if [ "$ROLLING" = true ]; then
              echo "$IMAGE:alpine-latest"
              echo "$IMAGE:latest"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Publish verified build layers with attestations
        if: steps.version.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.alpine
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          # Scan/artifact files must not change the verified build context.

  release:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.ref }}
          fetch-depth: 0
      - name: Create release after successful publication
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          IMAGE: armyguy255a/nginx
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$TAG" -m "nginx $VERSION"
            git push origin "refs/tags/$TAG"
          fi
          RESPONSE="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>&1)" && exit 0
          [[ "$RESPONSE" == *'HTTP 404'* ]] || { echo "$RESPONSE" >&2; exit 1; }
          gh release create "$TAG" --verify-tag --title "nginx $VERSION" \
            --notes "Published Docker Hub image: $IMAGE:alpine-$VERSION."
