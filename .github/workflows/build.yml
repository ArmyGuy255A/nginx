name: build-push

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: nginx-publish-${{ github.event_name == 'pull_request' && github.ref || 'dockerhub' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      ref: ${{ steps.version.outputs.ref }}
    env:
      IMAGE: armyguy255a/nginx
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Validate version and publication target
        id: version
        env:
          REQUESTED_REF: ${{ inputs.ref || github.ref }}
        run: |
          set -euo pipefail
          VERSION="$(jq -er '.nginx | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' versions.json)"
          grep -qx "ENV NGINX_VERSION=$VERSION" Dockerfile.alpine
          if [[ "$REQUESTED_REF" == refs/tags/* ]] && [ "$REQUESTED_REF" != "refs/tags/v$VERSION" ]; then
            echo 'Release tag does not match nginx version' >&2; exit 1
          fi
          PUBLISH=false
          ROLLING=false
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            if [[ "$REQUESTED_REF" == refs/tags/v* ]]; then
              PUBLISH=true
            elif [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
              PUBLISH=true
              ROLLING=true
            else
              echo 'Only current main or a matching release tag can publish' >&2; exit 1
            fi
          fi
          {
            echo "version=$VERSION"
            echo "publish=$PUBLISH"
            echo "rolling=$ROLLING"
            echo "ref=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.alpine
          load: true
          tags: nginx-ci:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          docker run --rm nginx-ci:verify nginx -v 2>&1 | grep -F "nginx/$VERSION"
          docker run --rm nginx-ci:verify nginx -t
          docker run -d --name nginx-smoke -p 127.0.0.1:8080:8080 nginx-ci:verify
          trap 'docker logs nginx-smoke; docker rm -f nginx-smoke' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 2 --fail http://127.0.0.1:8080/

      - name: Log in to Docker Hub
        if: steps.version.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare publication tags
        id: tags
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ROLLING: ${{ steps.version.outputs.rolling }}
        run: |
          set -euo pipefail
          if [ "$ROLLING" = true ]; then
            git fetch origin main
            [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || {
              echo 'main advanced during build; refusing to publish stale rolling tags' >&2; exit 1;
            }
          fi
          {
            echo 'tags<<EOF'
            echo "$IMAGE:alpine-$VERSION"
            echo "$IMAGE:sha-$(git rev-parse HEAD)"
            if [ "$ROLLING" = true ]; then
              echo "$IMAGE:alpine-latest"
              echo "$IMAGE:latest"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Publish verified build layers with attestations
        if: steps.version.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.alpine
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha

  release:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.ref }}
          fetch-depth: 0
      - name: Create release after successful publication
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          IMAGE: armyguy255a/nginx
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$TAG" -m "nginx $VERSION"
            git push origin "refs/tags/$TAG"
          fi
          RESPONSE="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>&1)" && exit 0
          [[ "$RESPONSE" == *'HTTP 404'* ]] || { echo "$RESPONSE" >&2; exit 1; }
          gh release create "$TAG" --verify-tag --title "nginx $VERSION" \
            --notes "Published Docker Hub image: $IMAGE:alpine-$VERSION."
