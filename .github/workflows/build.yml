name: build-push

# Replaces Docker Hub Automated Builds (deprecated by Docker; full retire
# 2027-04-01). See https://docs.docker.com/docker-hub/repos/manage/builds/migrate/
#
# Triggers:
#   * push to `main`           → publishes armyguy255a/nginx:alpine-latest
#   * push tag matching v*     → publishes armyguy255a/nginx:alpine-<ver>
#                                (e.g. tag `v1.30.1` → tag `alpine-1.30.1`)
#   * workflow_dispatch        → manual one-shot (uses the current ref's
#                                derived tags via the standard metadata
#                                action — same logic as push triggers)
#
# Both triggers fire from commits that check-versions.yml lands on main
# (a) on plain bumps → :alpine-latest, and (b) on nginx-version bumps
# where check-versions.yml ALSO pushes `v<ver>` → :alpine-<ver>.
#
# Required secrets (one-time GH repo setup):
#   DOCKERHUB_USERNAME   armyguy255a
#   DOCKERHUB_TOKEN      Personal Access Token (Read & Write) created at
#                        hub.docker.com → Account Settings → Personal
#                        Access Tokens. Store in repo Settings → Secrets
#                        and variables → Actions.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: armyguy255a/nginx

# Allow tag + branch builds to run in parallel (separate ref groups), but
# cancel any in-flight build for the SAME ref if a newer commit comes in.
concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + push (alpine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags + labels from ref
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=alpine-latest,enable={{is_default_branch}}
            type=match,pattern=v(.+),group=1,prefix=alpine-
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build + push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.alpine
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GH Actions cache layer — drops build time from ~5min to ~1min
          # on no-source-change rebuilds (e.g. when only versions.json
          # was bumped but the apk apt index didn't actually move).
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: always()
        run: |
          {
            echo "## Build summary"
            echo "- **Ref:** \`${{ github.ref }}\`"
            echo "- **Tags pushed:**"
            echo '  ```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '  ```'
          } >> "$GITHUB_STEP_SUMMARY"
