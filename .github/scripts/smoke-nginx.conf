load_module /etc/nginx/modules/ngx_otel_module.so;
worker_processes 1;
pid /tmp/nginx-smoke.pid;
error_log /dev/stderr;
events { worker_connections 32; }
http {
    access_log /dev/stdout;
    default_type text/html;
    server {
        listen 8080;
        root /var/www/html;
        more_set_headers 'X-Module-Smoke: passed';
        subs_filter '</body>' 'module-substitution-passed</body>';
        location / {
            fancyindex on;
        }
    }
}
